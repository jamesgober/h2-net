# =============================================================================
#  R E P S   ·   h2-net
# =============================================================================
[package]
name    = "h2-net"
version = "0.3.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "Sans-IO HTTP/2 engine for Rust: frames, HPACK, streams and flow control, with the same strictness and budgets as http-net."

# Keywords (5 max)
keywords = ["http2", "h2", "http", "hpack", "protocol"]

# Categories
categories = ["network-programming", "web-programming"]

# Links
homepage      = "https://github.com/jamesgober/h2-net"
repository    = "https://github.com/jamesgober/h2-net"
documentation = "https://docs.rs/h2-net"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "h2_net"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = []


# DEPENDENCIES
# #################################
[dependencies]
# The request and response types HTTP/2 maps onto, and the HTTP/1.1 parser
# the mapping runs through (first party, published; `no_std` with its
# default features off).
http-net = { version = "0.10", default-features = false }


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }


# BENCHMARKS
# #################################
[[bench]]
name    = "codec"
harness = false


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
